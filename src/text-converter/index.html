<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text converter – Octarift Tools</title>
    <meta name="description" content="Free online text converter: lowercase, UPPERCASE, camelCase, remove accents, join lines, fix spacing, URL and Base64 encoding, JSON formatting. Your text never leaves your browser." />
    <!-- Link previews (WhatsApp, Facebook, Slack…). Crawlers do not run scripts, so these stay in English;
         the page switches to Czech for Czech visitors at runtime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Octarift Tools" />
    <meta property="og:title" content="Text Converter" />
    <meta property="og:description" content="Free online text converter: lowercase, UPPERCASE, camelCase, remove accents, join lines, fix spacing, URL and Base64 encoding, JSON formatting. Your text never leaves your browser." />
    <meta property="og:url" content="https://tools.octarift.com/text-converter/" />
    <meta property="og:image" content="https://tools.octarift.com/og/text-converter.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Text Converter – Octarift Tools" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="cs_CZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" hreflang="cs" href="https://tools.octarift.com/text-converter/?lang=cs" />
    <link rel="alternate" hreflang="en" href="https://tools.octarift.com/text-converter/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://tools.octarift.com/text-converter/" />
    <!-- Apply the saved light/dark choice before first paint (see src/shared/color-scheme.ts). -->
    <script>try{var m=document.cookie.match(/(?:^|; )scheme=(light|dark)/);if(m)document.documentElement.dataset.scheme=m[1]}catch(e){}</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="./main.ts"></script>
  </head>
  <!-- Visible text is filled from strings.ts (data-i18n / data-i18n-attr); the Czech here is only the fallback. -->
  <body>
    <header class="site-header" data-site-header></header>

    <main class="tc">
      <h1 class="tc__title" data-i18n="heading">Převod textu</h1>
      <p class="tc__lead" data-i18n="lead"></p>

      <section class="tc__conversions" aria-labelledby="tc-conversions-title">
        <h2 id="tc-conversions-title" class="visually-hidden" data-i18n="conversions">Převody</h2>
        <div id="conversion-list" class="tc-groups"></div>
        <div id="replace-fields" class="tc-replace" hidden>
          <label class="tc-replace__field"
            ><span data-i18n="find">Najít</span
            ><input id="tc-find" type="text" spellcheck="false" autocomplete="off"
          /></label>
          <label class="tc-replace__field"
            ><span data-i18n="replaceWith">Nahradit za</span
            ><input id="tc-replace" type="text" spellcheck="false" autocomplete="off"
          /></label>
          <div class="tc-replace__options">
            <label class="tc-check"
              ><input id="tc-case" type="checkbox" /><span data-i18n="caseSensitive"
                >Rozlišovat velká a malá písmena</span
              ></label
            >
            <label class="tc-check"
              ><input id="tc-regex" type="checkbox" /><span data-i18n="regex">Regulární výraz</span></label
            >
          </div>
        </div>
        <div id="affix-fields" class="tc-replace" hidden>
          <label class="tc-replace__field"
            ><span data-i18n="prefix">Na začátek řádku</span
            ><input id="tc-prefix" type="text" spellcheck="false" autocomplete="off"
          /></label>
          <label class="tc-replace__field"
            ><span data-i18n="suffix">Na konec řádku</span
            ><input id="tc-suffix" type="text" spellcheck="false" autocomplete="off"
          /></label>
          <div class="tc-replace__options">
            <label class="tc-check"
              ><input id="tc-affix-skip" type="checkbox" /><span data-i18n="skipEmpty"
                >Vynechat prázdné řádky</span
              ></label
            >
          </div>
        </div>
        <div id="number-fields" class="tc-replace" hidden>
          <label class="tc-replace__field"
            ><span data-i18n="numberStart">Začít od</span
            ><input id="tc-number-start" type="number" inputmode="numeric" step="1" value="1"
          /></label>
          <label class="tc-replace__field"
            ><span data-i18n="numberSeparator">Za číslem</span
            ><input id="tc-number-sep" type="text" spellcheck="false" autocomplete="off" value=". "
          /></label>
          <div class="tc-replace__options">
            <label class="tc-check"
              ><input id="tc-number-pad" type="checkbox" /><span data-i18n="numberPad"
                >Doplnit nuly (01, 02…)</span
              ></label
            >
            <label class="tc-check"
              ><input id="tc-number-skip" type="checkbox" /><span data-i18n="skipEmpty"
                >Vynechat prázdné řádky</span
              ></label
            >
          </div>
        </div>
        <div id="list-fields" class="tc-replace" hidden>
          <label class="tc-replace__field"
            ><span data-i18n="listSeparator">Oddělovač</span
            ><input id="tc-list-sep" type="text" spellcheck="false" autocomplete="off" value=", "
          /></label>
        </div>
        <div id="filter-fields" class="tc-replace" hidden>
          <label class="tc-replace__field"
            ><span data-i18n="filterFind">Řádky obsahující</span
            ><input id="tc-filter-find" type="text" spellcheck="false" autocomplete="off"
          /></label>
          <div class="tc-replace__options">
            <label class="tc-check"
              ><input id="tc-filter-case" type="checkbox" /><span data-i18n="caseSensitive"
                >Rozlišovat velká a malá písmena</span
              ></label
            >
            <label class="tc-check"
              ><input id="tc-filter-regex" type="checkbox" /><span data-i18n="regex">Regulární výraz</span></label
            >
          </div>
        </div>
        <p id="conversion-hint" class="tc__hint" aria-live="polite"></p>
      </section>

      <section class="tc-pane tc-pane--input">
        <div class="tc-pane__head">
          <label for="tc-input" class="tc-pane__label" data-i18n="input">Vstup</label>
          <button id="tc-clear" class="button button--small" type="button" data-i18n="clear">Vymazat</button>
        </div>
        <textarea
          id="tc-input"
          class="tc-pane__text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Sem vložte nebo napište text…"
          data-i18n-attr="placeholder:inputPlaceholder"
        ></textarea>
        <p id="tc-input-stats" class="tc-pane__stats"></p>
      </section>

      <section class="tc-pane tc-pane--output">
        <div class="tc-pane__head">
          <label for="tc-output" class="tc-pane__label" data-i18n="output">Výsledek</label>
          <button
            id="tc-use"
            class="button button--small"
            type="button"
            data-i18n="useAsInput"
            data-i18n-attr="title:useAsInputHint"
          >
            Použít jako vstup
          </button>
          <button id="tc-copy" class="button button--small button--primary" type="button" data-i18n="copy">
            Kopírovat
          </button>
        </div>
        <textarea id="tc-output" class="tc-pane__text" spellcheck="false" readonly></textarea>
        <p id="tc-error" class="tc-pane__error" role="alert" hidden></p>
        <p id="tc-output-stats" class="tc-pane__stats"></p>
      </section>

      <aside class="tc__promo" data-promo="text-converter"></aside>
      <aside class="ad-slot" data-ad-slot="text-converter-bottom"></aside>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
