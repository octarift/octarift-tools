<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octarift Tools</title>
    <meta name="description" content="Simple free tools that run right in your browser: a countdown timer and a text converter." />
    <!-- Link previews (WhatsApp, Facebook, Slack…). Crawlers do not run scripts, so these stay in English;
         the page switches to Czech for Czech visitors at runtime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Octarift Tools" />
    <meta property="og:title" content="Octarift Tools" />
    <meta property="og:description" content="Simple free tools that run right in your browser: a countdown timer and a text converter." />
    <meta property="og:url" content="https://tools.octarift.com/" />
    <meta property="og:image" content="https://tools.octarift.com/og/hub.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Octarift Tools – free browser tools" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="cs_CZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" hreflang="cs" href="https://tools.octarift.com/?lang=cs" />
    <link rel="alternate" hreflang="en" href="https://tools.octarift.com/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://tools.octarift.com/" />
    <!-- Apply the saved light/dark choice before first paint (see src/shared/color-scheme.ts). -->
    <script>try{var m=document.cookie.match(/(?:^|; )scheme=(light|dark)/);if(m)document.documentElement.dataset.scheme=m[1]}catch(e){}</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="./hub.ts"></script>
  </head>
  <body>
    <header class="site-header" data-site-header></header>
    <main class="hub">
      <h1 class="hub__title" data-i18n="heading">Nástroje</h1>
      <p class="hub__lead" data-i18n="lead">Jednoduché nástroje, které běží přímo ve vašem prohlížeči.</p>
      <ul id="tool-list" class="tool-list"></ul>
      <aside data-promo="hub"></aside>
    </main>
    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
