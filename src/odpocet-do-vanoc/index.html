<!doctype html>
<!-- A Czech-first page (people search "odpočet do Vánoc"), so unlike the tools its static text is Czech;
     English visitors get the English text at runtime. %CHRISTMAS_YEAR% is filled in at build time (vite.config.ts). -->
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odpočet do Vánoc %CHRISTMAS_YEAR% – kolik dní zbývá do Vánoc | Octarift Tools</title>
    <meta name="description" content="Kolik dní zbývá do Vánoc? Živý odpočet do Štědrého dne %CHRISTMAS_YEAR% s vánočním motivem, na celou obrazovku. Kdy jsou Vánoce a advent %CHRISTMAS_YEAR%." />
    <!-- Link previews stay in English like on the other pages. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Octarift Tools" />
    <meta property="og:title" content="Christmas Countdown %CHRISTMAS_YEAR%" />
    <meta property="og:description" content="How many days until Christmas? A live countdown with a festive theme, fullscreen ready." />
    <meta property="og:url" content="https://tools.octarift.com/odpocet-do-vanoc/" />
    <meta property="og:image" content="https://tools.octarift.com/og/christmas.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Christmas Countdown – Octarift Tools" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" hreflang="cs" href="https://tools.octarift.com/odpocet-do-vanoc/?lang=cs" />
    <link rel="alternate" hreflang="en" href="https://tools.octarift.com/odpocet-do-vanoc/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://tools.octarift.com/odpocet-do-vanoc/" />
    <!-- Apply the saved light/dark choice before first paint (see src/shared/color-scheme.ts). -->
    <script>try{var m=document.cookie.match(/(?:^|; )scheme=(light|dark)/);if(m)document.documentElement.dataset.scheme=m[1]}catch(e){}</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="site-header" data-site-header></header>

    <main class="holiday">
      <h1 id="holiday-heading" class="holiday__title">Odpočet do Vánoc %CHRISTMAS_YEAR%</h1>

      <section class="stage" data-theme="christmas" aria-labelledby="holiday-heading">
        <div class="stage__fx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="stage__content">
          <p id="holiday-stage-title" class="stage__title">Do Štědrého dne</p>
          <div id="holiday-digits" class="digits" role="timer"></div>
          <p id="holiday-merry" class="stage__done" hidden>Veselé Vánoce!</p>
        </div>
      </section>

      <div id="holiday-days" class="segmented holiday__days" role="group" aria-label="Odpočítávat do">
        <button type="button" data-day="24" aria-pressed="true">Štědrý den (24. 12.)</button>
        <button type="button" data-day="25" aria-pressed="false">Boží hod (25. 12.)</button>
      </div>
      <p id="holiday-lead" class="holiday__lead"></p>
      <div class="holiday__actions">
        <a id="holiday-open" class="button button--primary" href="/countdown/">Otevřít na celou obrazovku</a>
        <button id="holiday-share" class="button" type="button">Sdílet odkaz</button>
      </div>

      <article id="holiday-text" class="text-page holiday__text">
        <h2>Kolik dní zbývá do Vánoc</h2>
        <p>Živý odpočet do Štědrého dne %CHRISTMAS_YEAR% až na sekundy, s vánočním motivem a na celou obrazovku.</p>
      </article>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
